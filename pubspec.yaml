name: ting_box
description: "BitTech Ting Box Flutter Client"

publish_to: 'none' 


version: 1.0.1+4

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.6
  camera: ^0.11.2+1
  image_picker: ^1.2.1
  http: ^1.6.0

  path_provider: ^2.1.5
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  dio: ^5.9.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  shimmer: ^3.0.0
  socket_io_client: ^3.1.2
  flutter_svg: ^2.2.2
  fl_chart: ^1.1.0
  permission_handler: ^12.0.1
  
dependency_overrides:
  vector_math: ^2.1.5
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/tingbox-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/icons/
    - assets/icons/icon.png
    - assets/icons/LOGO_BITTECH.png
    - assets/icons/logo_bittech.svg
    - assets/icons/bg-login.svg
    - assets/icons/tingbox-logo.png
    - assets/icons/tingbox_logo.svg
    - assets/icons/branding-bigtech.png
    - assets/icons/tingbox_logo_login.png
    - assets/images/
    - assets/images/tingbox_login/
    - assets/images/tingbox_login/tingbox_logo_login.png
    - assets/images/tingbox_login/2x/tingbox_logo_login.png
    - assets/images/tingbox_login/3x/tingbox_logo_login.png
    - assets/images/tingbox_login/4x/tingbox_logo_login.png

  fonts:
    - family: montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic




  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

